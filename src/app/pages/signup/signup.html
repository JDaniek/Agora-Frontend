<div class="background">
  <!-- Botón de regreso (redondo, discreto) -->
  <button
    type="button"
    class="back-btn"
    (click)="navigateToHome()"
    aria-label="Volver al inicio"
  >
    <span class="back-btn__icon"></span>
  </button>

  <div class="container">
    <h1>Bienvenido a Agora</h1>
    <p>¿Cómo deseas registrarte?</p>

    <div class="options">
      <!-- Asesor -->
      <button
        type="button"
        class="option"
        (click)="selectOption('asesor')"
        [class.selected]="selectedOption === 'asesor'"
      >
        <img src="/assets/asesor.png" alt="Asesor" />
        <span>Asesor</span>
      </button>

      <!-- Alumno -->
      <button
        type="button"
        class="option"
        (click)="selectOption('alumno')"
        [class.selected]="selectedOption === 'alumno'"
      >
        <img src="/assets/alumno.png" alt="Alumno" />
        <span>Alumno</span>
      </button>
    </div>

    <button
      class="continue-btn"
      [disabled]="!selectedOption"
      (click)="goToNextStep()"
      type="button"
    >
      Continuar
    </button>
  </div>
</div>
