<div class="background">
  <!-- Botón de regreso (igual familia visual que login) -->
  <button
    type="button"
    class="back-btn"
    (click)="navigateToHome()"
  >
    <span class="back-btn__icon" aria-hidden="true"></span>
    <span class="back-btn__label">Volver</span>
  </button>

  <div class="container">
    <h1>Únete a Agora</h1>
    <p>Rellena los siguientes datos</p>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <!-- Nombre -->
      <div class="input-group">
        <label for="firstName">Nombre</label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          placeholder="Ingresa tu nombre"
          required
          [(ngModel)]="formData.firstName"
        />
      </div>

      <!-- Segundo nombre (opcional) -->
      <div class="input-group">
        <label for="secondName">Segundo nombre (opcional)</label>
        <input
          type="text"
          id="secondName"
          name="secondName"
          placeholder="Ingresa tu segundo nombre"
          [(ngModel)]="formData.secondName"
        />
      </div>

      <!-- Apellidos -->
      <div class="input-group">
        <label for="lastName">Apellidos</label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          placeholder="Ingresa tus apellidos"
          required
          [(ngModel)]="formData.lastName"
        />
      </div>

      <!-- Correo electrónico -->
      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Ingresa tu correo electrónico"
          required
          email
          [(ngModel)]="formData.email"
        />
      </div>

      <!-- Contraseña -->
      <div class="input-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Ingresa tu contraseña"
          required
          minlength="6"
          [(ngModel)]="formData.password"
        />
      </div>

      <!-- Botones -->
      <button
        type="submit"
        class="btn btn-main"
        [disabled]="!registerForm.form.valid"
      >
        Crear cuenta
      </button>

      <button
        type="button"
        class="btn btn-secondary"
        (click)="navigateToLogin()"
      >
        Iniciar sesión
      </button>
    </form>
  </div>
</div>
