<!-- notificaciones.component.html -->
<div class="notifications-container">

  <h2 class="title">Centro de notificaciones</h2>

  <div class="notifications-list">

    <div
      class="notification-card"
      *ngFor="let n of notifications"
      [class.read]="n.isRead"
      (click)="markAsRead(n)"
    >
      <div class="header-row">
        <h3 class="notification-title">{{ n.title }}</h3>
        <span class="date">{{ n.date }}</span>
      </div>

      <p class="description">{{ n.description }}</p>

      <span class="status" [class.read]="n.isRead">
        {{ n.isRead ? 'Leída' : 'No leída' }}
      </span>
    </div>

  </div>

  <div *ngIf="notifications.length === 0" class="empty-state">
    No hay notificaciones disponibles.
  </div>

</div>
