<!-- dashboard-asesor.html -->
<section class="dashboard-wrap">

  <!-- Barra superior fija -->
  <header class="top-bar">
    <button class="menu-toggle" (click)="toggleSidebar()">
      <img src="/icon/Hamburger_MD.png" alt="Menú" />
    </button>
  </header>

  <!-- Menú lateral -->
  <nav class="sidebar-menu" [class.open]="isSidebarOpen">
    <a class="menu-item active" (click)="setView('inicio'); closeSidebar()">
      <img src="/icon/home.png" alt="Inicio" />
      Inicio
    </a>

    <a class="menu-item" (click)="setView('favoritos'); closeSidebar()">
      <img src="/icon/fav.png" alt="Favoritos" />
      Favoritos
    </a>

    <a class="menu-item" (click)="setView('chats'); closeSidebar()">
      <img src="/icon/chat.png" alt="Chats" />
      Chats
    </a>

    <a class="menu-item" (click)="setView('solicitudes'); closeSidebar()">
      <img src="/icon/solicitud.png" alt="Solicitudes" />
      Solicitudes
    </a>

    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">
        <img src="/icon/logout.png" alt="Cerrar sesión" />
        Cerrar sesión
      </button>
    </div>
  </nav>

  <!-- Overlay -->
  <div class="overlay" *ngIf="isSidebarOpen" (click)="closeSidebar()"></div>

  <!-- Contenido principal -->
  <main class="main-content" [class.main-content-shifted]="isSidebarOpen">
    <div class="content-header">
      <h1>Solicitudes</h1>
      <p class="subtitle">Tienes solicitudes pendientes:</p>
    </div>

    <!-- Aquí puedes meter tus secciones según currentView -->
  </main>

</section>
