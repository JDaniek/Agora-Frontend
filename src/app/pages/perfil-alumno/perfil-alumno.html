<!-- perfil-alumno.component.html -->

<section class="profile-container">

  <h1 class="title">Perfil del alumno</h1>
  <p class="subtitle">
    Configura tu información personal y académica.
  </p>

  <!-- Formulario principal -->
  <form class="profile-form" (ngSubmit)="saveProfile()" #formRef="ngForm">

    <!-- Foto -->
    <div class="form-group photo-group">
      <label for="photo">Foto de perfil</label>

      <div class="photo-preview" *ngIf="photoPreview">
        <img [src]="photoPreview" alt="Vista previa" />
      </div>

      <input
        type="file"
        id="photo"
        accept="image/*"
        (change)="onFileSelected($event)"
      />
    </div>

    <!-- Nombre -->
    <div class="form-row">
      <div class="form-group">
        <label for="name">Nombre</label>
        <input
          id="name"
          type="text"
          [(ngModel)]="profile.name"
          name="name"
          required
        />
      </div>

      <div class="form-group">
        <label for="lastName">Apellidos</label>
        <input
          id="lastName"
          type="text"
          [(ngModel)]="profile.lastName"
          name="lastName"
          required
        />
      </div>
    </div>

    <!-- Nivel educativo -->
    <div class="form-group">
      <label for="level">Nivel educativo</label>
      <select
        id="level"
        [(ngModel)]="profile.level"
        name="level"
        required
      >
        <option value="Bachillerato">Bachillerato</option>
        <option value="Universidad">Universidad</option>
        <option value="Posgrado">Posgrado</option>
      </select>
    </div>

    <!-- Intereses -->
    <div class="form-group">
      <label for="interests">Materias de interés</label>

      <select
        id="interests"
        multiple
        [(ngModel)]="profile.interests"
        name="interests"
      >
        <option *ngFor="let m of allInterests" [value]="m">
          {{ m }}
        </option>
      </select>
    </div>

    <!-- Ubicación -->
    <div class="form-row">
      <div class="form-group">
        <label for="city">Ciudad</label>
        <input
          id="city"
          type="text"
          [(ngModel)]="profile.city"
          name="city"
          required
        />
      </div>

      <div class="form-group">
        <label for="state">Estado</label>
        <input
          id="state"
          type="text"
          [(ngModel)]="profile.state"
          name="state"
          required
        />
      </div>
    </div>

    <!-- Botón Guardar -->
    <div class="actions">
      <button type="submit" class="btn-primary">
        Guardar cambios
      </button>
    </div>

    <!-- Mensaje de guardado -->
    <p class="save-message" *ngIf="saveSuccess">
      Los cambios han sido guardados correctamente.
    </p>
  </form>
</section>
