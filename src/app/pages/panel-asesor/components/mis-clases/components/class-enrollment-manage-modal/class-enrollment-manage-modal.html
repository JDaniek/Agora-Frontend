<section class="section-block">
  <h3>Buscar alumno con contacto aceptado</h3>

  <!-- Buscador -->
  <input
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="Escribe el nombre del alumno..."
    class="search-input"
  />

  <div *ngIf="contactsLoading" class="loading-state">
    <div class="spinner"></div>
    <p>Cargando tus contactos...</p>
  </div>

  <p *ngIf="!contactsLoading && filteredContacts.length === 0" class="empty-text">
    No se encontraron alumnos con ese nombre.
  </p>

  <ul *ngIf="!contactsLoading && filteredContacts.length > 0" class="students-list">
    <li *ngFor="let c of filteredContacts" class="student-row">

      <div class="avatar">
        <img *ngIf="c.studentAvatar"
             [src]="c.studentAvatar"
             alt="Foto del alumno"/>
        <div *ngIf="!c.studentAvatar" class="avatar-placeholder">
          {{ c.studentName.charAt(0) }}
        </div>
      </div>

      <div class="student-info">
        <div class="name">{{ c.studentName }}</div>
        <div class="last-msg" *ngIf="c.lastMessage">
          {{ c.lastMessage }}
        </div>
      </div>

      <button
        type="button"
        class="btn-add"
        [disabled]="isAlreadyEnrolled(c.otherParticipantId) || enrolling"
        (click)="onEnrollFromContact(c)"
      >
        <span *ngIf="isAlreadyEnrolled(c.otherParticipantId)">Ya inscrito</span>
        <span *ngIf="!isAlreadyEnrolled(c.otherParticipantId)">
          Inscribir a clase
        </span>
      </button>
    </li>
  </ul>

  <p *ngIf="errorMessage" class="error-text">
    {{ errorMessage }}
  </p>
</section>
